<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Scratchpad | Project 2</title>

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #3B73A9;
            color: #D4F2BD;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 30px;
        }

        /* --- Header Navigation --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 15px;
            margin-bottom: 50px;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-left: auto;
        }
        .nav-links a {
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: color 0.2s ease;
        }
        .nav-links a:hover {
            color: #D4F2BD;
        }
        .btn-linkedin {
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 8px 18px;
            border-radius: 20px;
            transition: all 0.2s ease !important;
        }
        .btn-linkedin:hover {
            background-color: #D4F2BD;
            color: #3B73A9 !important;
            border-color: #D4F2BD;
        }

        /* --- Hero Section --- */
        .hero {
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
            padding: 60px 0;
            flex-grow: 1;
        }
        .hero-title {
            font-size: 4rem;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -1px;
            margin-bottom: 20px;
        }

        /* --- Footer Section --- */
        footer {
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 30px;
            margin-top: 60px;
            text-align: center;
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .social-icons a {
            color: #D4F2BD;
            text-decoration: none;
            font-size: 1.2rem;
            transition: color 0.2s ease;
        }
        .social-icons a:hover {
            color: #FFFFFF;
        }
        .footer-text {
            color: #D4F2BD;
            font-size: 0.85rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/#about">About</a>
            <a href="/scratchpad">Scratchpad</a>
            <a href="https://www.linkedin.com/in/your-linkedin-profile" target="_blank" rel="noopener" class="btn-linkedin">
                LinkedIn
            </a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="hero">
        <h1 class="hero-title">TBA</h1>
    </main>

    <!-- Centered Footer -->
    <footer>
        <div class="social-icons">
            <a href="https://www.linkedin.com/in/your-linkedin-profile" target="_blank" rel="noopener">LinkedIn</a>
            <span>•</span>
            <a href="https://github.com/your-github-username" target="_blank" rel="noopener">GitHub</a>
        </div>
        <div class="footer-text">
            <p>Created by Jeff X using Python Flask.</p>
            <p>Cloud Support & DevOps Portfolio</p>
        </div>
    </footer>

</body>
</html>
