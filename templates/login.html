<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Scratchpad</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #3B73A9; /* Retains existing background color */
            color: #D4F2BD;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Page Header Banner --- */
        .login-header {
            padding: 60px 10% 40px 10%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .section-tag {
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 12px;
            opacity: 0.8;
        }

        .login-title {
            font-family: 'Italiana', Georgia, serif;
            font-size: 3.2rem;
            color: #D4F2BD;
            margin-bottom: 12px;
            font-weight: 400;
        }

        .login-subtitle {
            font-size: 1rem;
            color: #FFFFFF;
            opacity: 0.9;
        }

        /* --- Form Container --- */
        .login-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .login-form {
            width: 100%;
            max-width: 450px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background-color: #FFFFFF;
            color: #111111;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-group input::placeholder {
            color: #888888;
        }

        .form-group input:focus {
            border-color: #D4F2BD;
        }

        /* Pill Button */
        .btn-submit {
            background-color: #F8E27A; /* Soft yellow accent as shown in screenshot */
            color: #111111;
            border: none;
            padding: 12px 36px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #f1d866;
            transform: translateY(-2px);
        }

        /* Flash Error Messages */
        .flash-message {
            background-color: rgba(255, 99, 71, 0.2);
            border: 1px solid rgba(255, 99, 71, 0.5);
            color: #FFD1D1;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: center;
        }

        /* --- Footer Styles --- */
        footer {
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px 20px;
            text-align: center;
            width: 100%;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 12px;
        }

        .social-icons a {
            color: #F8E27A;
            font-size: 1.3rem;
            text-decoration: none !important;
            transition: color 0.2s ease, transform 0.2s ease;
            display: inline-block;
        }

        .social-icons a:hover {
            color: #FFFFFF;
            transform: translateY(-2px);
        }

        .footer-text {
            color: #D4F2BD;
            font-size: 0.85rem;
            line-height: 1.6;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="login-header">
        <div class="section-tag">SECURE ACCESS</div>
        <h1 class="login-title">Log In</h1>
        <p class="login-subtitle">Sign in to post comments on the Scratchpad.</p>
    </header>

    <!-- Main Content Form -->
    <main class="login-container">
        <form class="login-form" action="/login" method="POST">
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                {% for message in messages %}
                  <div class="flash-message">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-submit">Log In</button>
        </form>
    </main>

    <!-- Centered Footer -->
    <footer>
        <div class="social-icons">
            <a href="https://www.linkedin.com/in/your-linkedin-profile" target="_blank" rel="noopener" aria-label="LinkedIn">
                <i class="fab fa-linkedin"></i>
            </a>
            <a href="https://github.com/your-github-username" target="_blank" rel="noopener" aria-label="GitHub">
                <i class="fab fa-github"></i>
            </a>
        </div>
        <div class="footer-text">
            <p>Created by Jeff X using Python Flask.</p>
            <p>Cloud Support & DevOps Portfolio</p>
        </div>
    </footer>

</body>
</html>
